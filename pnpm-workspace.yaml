overrides:
  # One React across the workspace. Two copies break every hook.
  react: 19.2.8
  react-dom: 19.2.8

packages:
  - "apps/*"
  - "packages/*"
# Packages allowed to run install scripts (pnpm 11 and later).
allowBuilds:
  supabase: true
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  # Inngest pulls this in. It compiles protobuf definitions at install time.
  protobufjs: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.70.1'
  - '@typescript-eslint/parser@8.70.1'
  - '@typescript-eslint/project-service@8.70.1'
  - '@typescript-eslint/scope-manager@8.70.1'
  - '@typescript-eslint/tsconfig-utils@8.70.1'
  - '@typescript-eslint/type-utils@8.70.1'
  - '@typescript-eslint/types@8.70.1'
  - '@typescript-eslint/typescript-estree@8.70.1'
  - '@typescript-eslint/utils@8.70.1'
  - '@typescript-eslint/visitor-keys@8.70.1'
  - jsdom@30.1.1
  - typescript-eslint@8.70.1
  - '@supabase/auth-js@2.117.0'
  - '@supabase/functions-js@2.117.0'
  - '@supabase/postgrest-js@2.117.0'
  - '@supabase/realtime-js@2.117.0'
  - '@supabase/storage-js@2.117.0'
  - '@supabase/supabase-js@2.117.0'
  - inngest@4.21.0
